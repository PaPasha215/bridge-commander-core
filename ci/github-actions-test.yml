name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cd tests && python -W error::ResourceWarning -m unittest -v
      - run: pip install mcp && python tests/sdk_compat.py
        if: matrix.python == '3.12'
      - run: python scripts/build_pyz.py && python dist/bridge-commander.pyz version
