[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-commander"
dynamic = ["version"]
description = "Self-hosted MCP server: files, search, terminal sessions and remote nodes for Claude, ChatGPT and other MCP clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["mcp", "model-context-protocol", "claude", "chatgpt", "terminal", "remote", "ssh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Environment :: Console",
]

[project.scripts]
bridge-commander = "bridge_commander.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bridge_commander.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
